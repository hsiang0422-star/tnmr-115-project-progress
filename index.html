*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.grid{display:grid;grid-template-columns:minmax(200px,260px) minmax(640px,1fr);min-width:900px}
.lbl-head,.lbl-row{position:sticky;left:0;background:var(--panel);z-index:2;border-right:1px solid var(--line);padding:6px 10px}

.axis{position:relative;height:34px;border-bottom:1px solid var(--line)}
.axis span{position:absolute;top:9px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.proj-row{background:var(--bg);font-weight:600;font-size:13px}

.na-tag{flex:none;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:1px 6px}
.memo:hover,.memo:focus-visible{outline:2px solid #e0a800;outline-offset:1px}
.memo{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;line-height:1;padding:3px 8px;border-radius:11px;background:#fff3cd;color:#7a5a00;border:1px solid #f0d58a;cursor:help}
:root[data-theme="dark"] .memo{background:#3a3016;color:#f3d27a;border-color:#6b5520}

.tip .note-box{display:block;margin:8px 0;padding:8px 10px;border-radius:5px;background:#fff3cd;color:#5c4400;border-left:3px solid #e0a800;white-space:pre-wrap;font-weight:600}
.tip.memo-only{background:none;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:5px}
.tip.memo-only .note-box{margin:0;border:1px solid #f0d58a;border-left:3px solid #e0a800}
.track{position:relative;height:30px;border-bottom:1px solid var(--grid)}
.track.proj-row{height:26px}
.lbl-row.proj-row{height:auto;min-height:34px;white-space:normal;border-top:2px solid var(--line)}
.proj-row .plinks{display:block;font-weight:400;font-size:12px;margin-top:2px}
.proj-row .plinks a{color:var(--brand);display:block}
.leg-cell{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--muted);padding:6px 10px;background:var(--bg);border-top:2px solid var(--line);border-bottom:1px solid var(--grid);min-height:34px}
.leg-cell span{display:inline-flex;align-items:center;gap:5px}
.mlab{position:absolute;top:8px;background:var(--panel);margin-left:1px;padding-right:3px;line-height:16px;font-size:11px;color:var(--muted);font-weight:400;padding-left:3px;white-space:nowrap;pointer-events:none;z-index:2}
.mlab.yr{color:var(--brand);font-weight:700}
.hline{position:absolute;top:0;width:1px;background:var(--brand);pointer-events:none;z-index:3}
.hline[hidden]{display:none}
.vline{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:1}
.today-tag{position:absolute;top:-1px;transform:translateX(-50%);font-size:10px;background:var(--today);color:#fff;padding:0 4px;border-radius:3px;z-index:2}
.plan{position:absolute;top:6px;height:7px;border:1px dashed var(--muted);border-radius:2px;opacity:.7}
.act{position:absolute;top:15px;height:9px;border-radius:2px}

.hit{position:absolute;inset:0;cursor:pointer}
.hit:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.tip{position:fixed;z-index:20;background:var(--fg);color:var(--bg);font-size:14px;padding:10px 12px;border-radius:8px;max-width:340px;pointer-events:none;line-height:1.6}
.tip[hidden]{display:none}
.photos{margin-top:18px}

.ph{margin:0}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

.ph img{cursor:zoom-in}

.lb-cap{color:#fff;font-size:13px;margin:12px 0 0;text-align:center}

.lb button[hidden]{display:none}
.lb-close{position:absolute;top:12px;right:12px}
.lb-prev{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.lb-next{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.note b{color:var(--fg)}

const CODE = {d:'done', g:'doing', t:'todo', f:'fail', n:'na'};

// Derive per-task status and overdue flag (p.tasks holds raw tuples until normalized)
function normalize(p){
  p.tasks = p.tasks.map(r => {
    const [id,name,ps,pe,as,ae,c,note] = r;
    let st = CODE[c];
    if (st !== 'done' && st !== 'fail' && st !== 'na' && pe && t(pe) < t(TODAY)) st = 'overdue';
    return {id,name,ps,pe,as,ae,st,raw:c,note:note||''};
  });
}
PROJECTS.forEach(normalize);

let state = {sel:0, scope:'all', filter:'all'};
const pct = d => (t(d) - t(RANGE_START)) / (t(RANGE_END) - t(RANGE_START)) * 100;
const clamp = (v) => Math.max(0, Math.min(100, v));
const fmt = d => d ? d.replace(/-/g,'/') : '—';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allOverdue(p){ return p.tasks.filter(x => x.st==='overdue').length; }

function renderKPIs(){
  const done = PROJECTS.reduce((a,p)=>a+p.done,0), total = PROJECTS.reduce((a,p)=>a+p.total,0);
  const od = PROJECTS.reduce((a,p)=>a+allOverdue(p),0);
  const doing = PROJECTS.filter(p=>p.tasks.some(x=>x.st==='doing')).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="lab">整體完成度</div><div class="val">${(done/total*100).toFixed(1)}%</div><div class="hint">${done} ／ ${total} 項</div></div>
    <div class="kpi"><div class="lab">工程專案</div><div class="val">${PROJECTS.length}</div><div class="hint">已完工 0 案，進行中 ${doing} 案</div></div>
    <div class="kpi"><div class="lab">逾期未完成任務</div><div class="val" style="color:var(--overdue)">${od}</div><div class="hint">預定完成日已過</div></div>`;
}

function renderProjects(){
  document.getElementById('projects').innerHTML = PROJECTS.map((p,i)=>`

      <div class="name">${esc(p.name)}</div>

      <div class="bar"><i style="width:${p.pct}%"></i></div>
    </button>`).join('');
}

function monthLabels(){
  let s=''; const d=new Date(Date.UTC(2025,11,1));
  while (d <= new Date(Date.UTC(2027,7,1))) {
    const iso=d.toISOString().slice(0,10), m=d.getUTCMonth()+1;
    const yr = m===1 || s==='';
    s+=`<div class="mlab${m===1?' yr':''}" style="left:${clamp(pct(iso))}%">${yr ? d.getUTCFullYear()+'/'+m : m+'月'}</div>`;
    d.setUTCMonth(d.getUTCMonth()+1);
  }
  return s;
}
const LEGEND = `<span><i class="sw" style="background:var(--done)"></i>已完成</span><span><i class="sw" style="background:var(--doing)"></i>進行中</span><span><i class="sw" style="background:var(--overdue)"></i>逾期未完成</span><span><i class="sw" style="background:var(--todo)"></i>未開始</span><span><i class="sw" style="background:var(--fail)"></i>流標</span><span><i class="sw" style="border:1px dashed var(--muted);background:none"></i>預定期程</span><span><b style="color:#e0a800;font-size:14px;line-height:1">★</b>有備註（滑鼠移過去看內容）</span>`;
function axisHTML(){
  const ticks = [];
  const d = new Date(Date.UTC(2025,11,1));
  while (d <= new Date(Date.UTC(2027,7,1))) {
    const s = d.toISOString().slice(0,10);
    const m = d.getUTCMonth()+1;
    const show = m % 3 === 1 || m === 1;
    ticks.push({s, p:clamp(pct(s)), label: show ? `${d.getUTCFullYear()}/${String(m).padStart(2,'0')}` : '', line: true});
    d.setUTCMonth(d.getUTCMonth()+1);
  }
  return ticks.map(k=>`<span style="left:${k.p}%">${k.label}</span>`).join('');
}
function gridLines(){
  let s=''; const d=new Date(Date.UTC(2025,11,1));
  while (d <= new Date(Date.UTC(2027,7,1))) {
    const iso=d.toISOString().slice(0,10);
    s+=`<div class="vline" style="left:${clamp(pct(iso))}%"></div>`;
    d.setUTCMonth(d.getUTCMonth()+1);
  }
  return s;
}

function barsFor(task){
  let out = '';
  if (task.ps && task.pe) {
    const oneDay = 100*DAY/(t(RANGE_END)-t(RANGE_START));
    const a = clamp(pct(task.ps)), b = clamp(pct(task.pe) + oneDay);
    out += `<div class="plan" style="left:${a}%;width:${Math.max(b-a,0.3)}%"></div>`;
  }
  let as = task.as, ae = task.ae;
  if (as) {
    if (!ae && (task.st === 'doing' || (task.st === 'overdue' && task.raw === 'g'))) ae = TODAY;
    if (!ae && task.st === 'fail') ae = as;
    const a = clamp(pct(as)), b = clamp(pct(ae || as) + 0.25);
    out += `<div class="act ${task.st}" style="left:${a}%;width:${Math.max(b-a,0.3)}%"></div>`;
  }
  return out;
}

function memoStar(task){
  const ends = [task.pe, task.ae, task.as, task.ps].filter(Boolean);
  if (!task.ae && task.as && (task.st === 'doing' || task.raw === 'g')) ends.push(TODAY);
  if (!ends.length) return `<div class="memo-star" style="left:0" aria-hidden="true">★</div>`;
  const last = ends.sort().pop();
  const left = clamp(pct(last) + 100*DAY/(t(RANGE_END)-t(RANGE_START)));
  return `<div class="memo-star" style="left:${left}%" aria-hidden="true">★</div>`;
}
function tipText(p, task){
  const note = task.note ? `<span class="note-box">★ 備註：${esc(task.note)}</span>` : '';
  return `<b>${esc(task.id)} ${esc(task.name)}</b>${note || '<br>'}${esc(p.short)}<br>狀態：${ST_LABEL[task.st]}<br>預定：${fmt(task.ps)} ～ ${fmt(task.pe)}<br>實際：${fmt(task.as)} ～ ${fmt(task.ae)}`;
}

  return list.length ? `<span class="plinks">${list.map(([t,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join('')}</span>` : '';
};
function renderGantt(){
  const projs = state.scope==='all' ? PROJECTS.map((p,i)=>[p,i]) : [[PROJECTS[state.sel], state.sel]];
  let head = '';
  let rows = '';
  projs.forEach(([p,i]) => {
    const tasks = p.tasks.filter(x => state.filter==='all' || (state.filter==='open' && x.st!=='done' && x.st!=='na') || (state.filter==='overdue' && x.st==='overdue') || (state.filter==='note' && x.note));
    if (!tasks.length) return;
    rows += `<div class="lbl-row proj-row"><span>${esc(p.name)}${projLinks(p)}</span></div><div class="leg-cell">${LEGEND}</div>`;
    rows += `<div class="lbl-head">工作項目</div><div class="axis">${gridLines()}${monthLabels()}<div class="today" style="left:${pct(TODAY)}%"></div></div>`;
    tasks.forEach(x => {
      rows += `<div class="lbl-row${x.st==='na' ? ' na' : ''}"><span class="id">${esc(x.id)}</span><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span>${x.st==='na' ? '<span class="na-tag">不適用</span>' : ''}${x.note ? `<span class="memo" tabindex="0" role="button" aria-label="${esc('備註：' + x.note)}" data-p="${PROJECTS.indexOf(p)}" data-t="${p.tasks.indexOf(x)}">★ 備註</span>` : ''}</div>
      <div class="track">${gridLines()}<div class="today" style="left:${pct(TODAY)}%"></div>${barsFor(x)}${x.note ? memoStar(x) : ''}
        <div class="hit" tabindex="0" role="button" aria-label="${esc(p.short+' '+x.id+' '+x.name+' '+ST_LABEL[x.st])}" data-p="${PROJECTS.indexOf(p)}" data-t="${p.tasks.indexOf(x)}"></div></div>`;
    });
  });
  if (!rows) rows = `<div class="lbl-row" style="grid-column:1/-1;padding:16px;color:var(--muted)">沒有符合條件的任務</div>`;
  document.getElementById('grid').innerHTML = head + rows;
}

function setPressed(id, v){
  document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v===v)));
}

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.classList.remove('memo-only'); tip.innerHTML = html; tip.hidden = false;
  const r = e.target.getBoundingClientRect();
  const x = Math.min(window.innerWidth - 270, Math.max(8, r.left + r.width/2 - 120));
  tip.style.left = x + 'px'; tip.style.top = (r.top - 8 - tip.offsetHeight) + 'px';
  if (parseFloat(tip.style.top) < 0) tip.style.top = (r.bottom + 8) + 'px';
}
const ganttEl = document.getElementById('gantt'), gridEl = document.getElementById('grid'), hline = document.getElementById('hline');
const WD = '日一二三四五六';
function dateAt(clientX, el){
  const r = el.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const d = new Date(t(RANGE_START) + ratio * (t(RANGE_END) - t(RANGE_START)));
  return `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}（${WD[d.getUTCDay()]}）`;
}
function hideHover(){ tip.hidden = true; hline.hidden = true; tip.classList.remove('memo-only'); }
function placeTip(cx, cy){
  let x = cx + 14, y = cy + 16;
  if (x + tip.offsetWidth > innerWidth - 8) x = cx - 14 - tip.offsetWidth;
  if (y + tip.offsetHeight > innerHeight - 8) y = cy - 16 - tip.offsetHeight;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
// 工作項目欄的「★ 備註」標籤：滑鼠移過去、鍵盤聚焦或手機點一下，只顯示備註文字（完整任務卡片留給甘特圖）
function showMemo(m, cx, cy){
  const p = PROJECTS[m.dataset.p], x = p.tasks[m.dataset.t];
  hline.hidden = true;
  tip.classList.add('memo-only');
  tip.innerHTML = `<span class="note-box">★ 備註：${esc(x.note)}</span>`; tip.hidden = false;
  if (cx == null) { const r = m.getBoundingClientRect(); cx = r.left; cy = r.bottom - 8; }
  placeTip(cx, cy);
}
gridEl.addEventListener('click', e => { const m = e.target.closest('.memo'); if (m) showMemo(m, e.clientX, e.clientY); });
document.addEventListener('click', e => { if (!e.target.closest('#grid')) hideHover(); });
gridEl.addEventListener('pointermove', e => {
  const m = e.target.closest('.memo'); if (m) { showMemo(m, e.clientX, e.clientY); return; }
  const tr = e.target.closest('.track, .axis'); if (!tr) { hideHover(); return; }
  let html = `<b>游標日期：${dateAt(e.clientX, tr)}</b>`;
  const h = e.target.closest('.hit');
  if (h) { const p = PROJECTS[h.dataset.p], x = p.tasks[h.dataset.t]; html += `<div style="border-top:1px solid currentColor;opacity:.35;margin:5px 0"></div>` + tipText(p,x); }
  tip.classList.remove('memo-only');
  tip.innerHTML = html; tip.hidden = false;
  placeTip(e.clientX, e.clientY);
  hline.hidden = false;
  hline.style.left = (e.clientX - ganttEl.getBoundingClientRect().left + ganttEl.scrollLeft) + 'px';
  hline.style.height = gridEl.offsetHeight + 'px';
});
gridEl.addEventListener('pointerleave', hideHover);
document.getElementById('grid').addEventListener('focusin', e => {
  const m = e.target.closest('.memo'); if (m) { showMemo(m); return; }
  const h = e.target.closest('.hit'); if (!h) return;
  const p = PROJECTS[h.dataset.p], x = p.tasks[h.dataset.t];
  showTip({target:h}, tipText(p,x));
});
document.getElementById('grid').addEventListener('focusout', () => { tip.hidden = true; });

document.getElementById('projects').addEventListener('click', e => {
  const b = e.target.closest('.pcard'); if (!b) return;
  state.sel = +b.dataset.i; state.scope = 'sel';
  setPressed('scope','sel'); renderProjects(); renderGantt();
});
document.getElementById('scope').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.scope = b.dataset.v; setPressed('scope', state.scope); renderGantt();
});
document.getElementById('filter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.filter = b.dataset.v; setPressed('filter', state.filter); renderGantt();

const PHOTOS = [
  { pid: 1, zone: '共融遊具', src: 'photos/pe-20261107-2.jpg', date: '2026-11-07', caption: '體能器材區地墊' },
  { pid: 1, src: 'photos/pe-20261107-1.jpg', date: '2026-11-07', caption: '遊具區現況' },
  { pid: 1, src: 'photos/pe-20261107-3.jpg', date: '2026-11-07', caption: '基地地坪，器材堆放中' },
  { pid: 2, src: 'photos/gf-20261107-1.jpg', date: '2026-11-07', caption: '小便斗區現況' },
  { pid: 2, src: 'photos/gf-20261107-2.jpg', date: '2026-11-07', caption: '室內牆面及小便斗' },
  { pid: 2, src: 'photos/gf-20261107-3.jpg', date: '2026-11-07', caption: '牆面及水龍頭' },
  { pid: 2, src: 'photos/gf-20261107-4.jpg', date: '2026-11-07', caption: '地坪抹平施工中' },
];
let LB = [], lbI = 0; // 目前顯示的照片清單（依上傳日期新到舊）與目前索引
function renderPhotos(){
  LB = [...PHOTOS].sort((a,b) => b.date.localeCompare(a.date));
  const card = ph => `<figure class="ph"><img src="${esc(ph.src)}" data-i="${LB.indexOf(ph)}" tabindex="0" role="button" aria-label="放大檢視 ${esc(ph.caption || PROJECTS[ph.pid-1].short)}" alt="${esc(ph.caption || PROJECTS[ph.pid-1].short)}" loading="lazy"><figcaption><b>${esc(ph.date.replace(/-/g,'/'))} 上傳</b>${ph.caption ? ' · ' + esc(ph.caption) : ''}</figcaption></figure>`;
  document.getElementById('areas').innerHTML = PROJECTS.map((p,i) => {
    const list = LB.filter(ph => ph.pid === i+1);
    if (!list.length) return `<section class="parea"><h3>${esc(p.name)}</h3><p class="empty">尚未上傳照片</p></section>`;
    // 依 zone（地點）分組，沒有 zone 的照片放在無標題的群組
    const groups = new Map();
    list.forEach(ph => { const k = ph.zone || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(ph); });
    const body = [...groups].map(([zone, items]) => `${zone ? `<h4 class="zone">${esc(zone)}</h4>` : ''}<div class="pgrid">${items.map(card).join('')}</div>`).join('');
    return `<section class="parea"><h3>${esc(p.name)}</h3>${body}</section>`;
  }).join('');
}
// 燈箱：點擊照片放大，可用按鈕、方向鍵切換，Esc 或點背景關閉
const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img'), lbCap = document.getElementById('lb-cap');
function showLB(i){
  lbI = (i + LB.length) % LB.length;
  const ph = LB[lbI], name = PROJECTS[ph.pid-1].short;
  lbImg.src = ph.src;
  lbImg.alt = ph.caption || name;
  lbCap.textContent = `${name}｜${ph.date.replace(/-/g,'/')} 上傳${ph.caption ? '｜' + ph.caption : ''}（${lbI+1} / ${LB.length}）`;
  const multi = LB.length > 1;
  lb.querySelector('.lb-prev').hidden = !multi;
  lb.querySelector('.lb-next').hidden = !multi;
}
function openLB(i){
  showLB(i);
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  lb.querySelector('.lb-close').focus();
}
function closeLB(){
  lb.hidden = true;
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const img = e.target.closest('.ph img[data-i]');
  if (img) { openLB(+img.dataset.i); return; }
  if (!lb.hidden) {
    if (e.target === lb || e.target.closest('.lb-close')) closeLB();
    else if (e.target.closest('.lb-prev')) showLB(lbI - 1);
    else if (e.target.closest('.lb-next')) showLB(lbI + 1);
  }
});
document.addEventListener('keydown', e => {
  if (!lb.hidden) {
    if (e.key === 'Escape') closeLB();
    else if (e.key === 'ArrowLeft') showLB(lbI - 1);
    else if (e.key === 'ArrowRight') showLB(lbI + 1);
    return;
  }
  if (e.key === 'Enter' && e.target.matches('.ph img[data-i]')) openLB(+e.target.dataset.i);
});
// 公開鏡像試算表（個人帳號，以 IMPORTRANGE 自動同步學校原始試算表 1ocB5KTsdMfxwsoi3hO2SZsPs2aGNNsGs_efBiMlikzY）
const SHEET_ID = '1-faQIzsanySNZc-RZEr31LzLWj8eMN2rVZwyrWFOk8U';
const TABS = [
  '共融遊具改建工程(1150907修)',
  '性別友善廁所工程(1150907修)',
  '跑道改建工程(1150907修)',
  '無障礙斜坡道工程(1150907修)',
  '交通車廊道鋼構工程'
];
const RANGE = 'A1:K70'; // K 欄為「備註說明」
const STATUS_CODE = {'已完成':'d','進行中':'g','流標':'f','未開始':'t','不適用':'n'};
const normDate = s => {
  const m = String(s||'').trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : null;
};
// gviz returns typed cells: text as string, dates as "Date(y,m0,d)"
const cellText = c => {
  if (!c) return '';
  const v = c.v;
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const [y,m,d] = v.slice(5,-1).split(',').map(Number);
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  if (v === null || v === undefined) return c.f ?? '';
  return String(v);
};
const gvizRows = table => (table.rows || []).map(r => (r.c || []).map(cellText));
function parseTab(rows){
  let total = null, done = null;
  rows.slice(0,6).forEach(row => row.forEach((k,j) => {
    const n = String(row[j+1] ?? '').trim() === '' ? NaN : Number(row[j+1]);
    if (String(k).trim() === '總任務數:' && n > 0) total = n;
    if (String(k).trim() === '已完成:' && n >= 0) done = n;
  }));
  const tasks = [];
  rows.forEach(row => {
    const id = String(row[0]||'').trim();
    if (!/^\d+\.\d+$/.test(id)) return;
    const status = String(row[9]||'').trim();
    if (status === '不適用' && !String(row[10]||'').trim()) return; // 不適用但有備註的任務仍顯示
    const code = STATUS_CODE[status] || (status ? null : 't');
    if (!code) return;
    tasks.push([id, String(row[2]||'').trim(), normDate(row[5]), normDate(row[6]), normDate(row[7]), normDate(row[8]), code, String(row[10]||'').trim()]);
  });
  return {tasks, total, done};
}
function applyLive(i, rows){
  const p = PROJECTS[i];
  const parsed = parseTab(rows);
  if (!parsed.tasks.length) return false;
  p.tasks = parsed.tasks;
  p.done = parsed.done ?? parsed.tasks.filter(x => x[6]==='d').length;
  p.total = parsed.total ?? p.total ?? parsed.tasks.length;
  p.pct = +(p.done / p.total * 100).toFixed(1);
  normalize(p);
  return true;
}
const liveEl = document.getElementById('live');
const fmtTime = ms => new Date(ms).toLocaleTimeString('zh-TW', {timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit'});
let lastSync = null;
function setLive(msg){ liveEl.textContent = msg; }
// Each tab is fetched as a JSONP-style response: google.visualization.Query.setResponse({...});
function loadGviz(name, range = RANGE){
  return new Promise((resolve, reject) => {
    const cb = 'gv_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    // 每個請求用各自的回呼名稱，避免同時讀多個分頁時互相覆蓋
    window[cb] = resp => { cleanup(); resp.status === 'ok' ? resolve(gvizRows(resp.table)) : reject(new Error(resp.status)); };
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0&sheet=${encodeURIComponent(name)}&range=${encodeURIComponent(range)}&_=${Date.now()}`;
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    document.head.appendChild(s);
  });
}
// gviz 會依「多數型別」決定每欄型別，少數型別的格子（如「總任務數:」）會變成空值，
// 所以摘要列（第 3 或 4 列）另外以單列範圍讀取，任務列用整段範圍讀取。
async function loadTab(i){
  const [r3, r4, body] = await Promise.all([
    loadGviz(TABS[i], 'A3:J3').catch(() => []),
    loadGviz(TABS[i], 'A4:J4').catch(() => []),
    loadGviz(TABS[i], RANGE)
  ]);
  return [...r3, ...r4, ...body];
}
async function syncAll(){
  let ok = 0;
  const results = await Promise.allSettled(TABS.map((_, i) => loadTab(i)));
  results.forEach((r, i) => { if (r.status === 'fulfilled' && applyLive(i, r.value)) ok++; });
  if (ok === 0) {
    setLive('無法讀取試算表，顯示的是 2026/11/07 的快照資料。請確認公開鏡像試算表仍為「知道連結的任何人可檢視」');
    return;
  }
  lastSync = Date.now();
  renderKPIs(); renderProjects(); renderGantt();
  setLive(`已同步 ${fmtTime(lastSync)}（每 5 分鐘更新${ok < TABS.length ? '；部分分頁讀取失敗' : ''}）`);
}
renderPhotos();
syncAll();
setInterval(syncAll, 5 * 60 * 1000);
</script>
